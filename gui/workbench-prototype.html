</style></head><body>
<div id="app"></div><div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="file-picker" accept=".wgl" multiple hidden>
<dialog id="link-dialog"><div class="eyebrow">关联转换结果</div><h2>选择 SCAN / MBIST 测试项</h2><p class="hint">只关联您选中的测试项。此原型不会写入 FLOW。</p><label class="field"><span>当前程序 · CP1</span><select id="link-target"><option>Scan_Chain_Test</option><option>Scan_AtSpeed_Test</option><option>Mbist_Test</option></select></label><div class="row"><button data-action="close-link">取消</button><button class="primary" data-action="confirm-link">确认关联</button></div></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const variants={A:'左侧导航',B:'顶部页签',C:'分步操作'};
const initial=new URLSearchParams(location.search).get('variant');
const state={variant:variants[initial]?initial:'A',page:'home',book:false,revision:0,files:[],inputRevision:0,adapt:false,source:'current',other:false,platforms:['chroma','s100'],step:0,job:null,result:null,association:null,output:'SCAN_Output',preview:'pattern'};
let toastTimer;
function notify(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3300)}
function stale(){const r=state.result;return !!r&&(r.inputRevision!==state.inputRevision||(r.adapt&&r.source==='current'&&r.revision!==state.revision))}
function valid(){return state.files.length&&state.platforms.length&&(!state.adapt||(state.source==='current'?state.book:state.other))}
function badge(text,kind=''){return `<span class="badge ${kind}">${text}</span>`}
function nav(){if(state.variant==='A'&&state.page!=='home')return '<button class="return-home" data-page="home" aria-label="返回工作台首页" title="返回工作台首页（保留当前状态）"><span class="nav-icon">←</span>返回</button>';return [['home','⌂','首页'],['program','▤','程序生成'],['scan','⇄','SCAN 转换']].map(([id,icon,label])=>`<button data-page="${id}" class="${state.page===id?'active':''}" aria-current="${state.page===id?'page':'false'}"><span class="nav-icon">${icon}</span>${label}</button>`).join('')}
function heading(eyebrow,title,desc,actions=''){return `<div class="page-heading row between"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="row">${actions}</div></div>`}
function render(){document.body.className='variant-'+state.variant+(state.page!=='home'?' tool-open':'');$('#app').innerHTML=`<header class="shell-header"><div class="brand"><b>M</b>MCU 工作台</div><span class="prototype-note">交互原型 · 示例数据 · 不执行转换或写入</span><div class="row"><span class="workspace-name muted">${state.book?'program_PCD009_V1.0.xlsx':'尚未打开程序'}</span>${state.book?badge(state.revision?'草稿 · '+state.revision+' 处修改':'示例工作簿'):badge('可独立转换','gray')}</div></header><nav class="top-nav">${nav()}</nav><div class="layout"><aside class="nav"><div class="nav-label">工作空间</div>${nav()}<div class="nav-footer">内置工具<br>统一安装与更新</div></aside><main>${state.page==='home'?home():state.page==='program'?program():scan()}${demo()}</main></div><div class="switcher" aria-label="原型布局切换"><button data-variant="prev" aria-label="上一个布局">←</button><small>比较布局</small>${Object.entries(variants).map(([k,n])=>`<button data-variant="${k}" class="${state.variant===k?'active':''}">${k} · ${n}</button>`).join('')}<button data-variant="next" aria-label="下一个布局">→</button></div>`;wireInputs()}
function home(){return heading('MCU WORKBENCH','从这里开始工作','程序生成与 Pattern 转换，共用一个工作台。')+`<div class="tool-grid"><article class="tool-card"><div class="tool-icon">▤</div><div class="stack"><h2>程序生成</h2><p>编辑测试流程、配置 Pattern 与存储映射，检查并生成测试程序。</p></div><footer><button class="primary" data-page="program">${state.book?'继续编辑程序':'进入程序生成'} →</button></footer></article><article class="tool-card"><div class="tool-icon">⇄</div><div class="stack"><h2>SCAN 转换</h2><p>将 WGL 转换为 Pattern、代码片段和时序。支持独立 Full Pin 或适配程序配置。</p></div><footer><button class="primary" data-page="scan">进入 SCAN 转换 →</button></footer></article></div><div class="home-lower"><section class="panel"><div class="panel-head row between"><h2>最近程序</h2>${badge('示例','gray')}</div><div class="file-row"><div><div class="file-title">program_PCD009_V1.0.xlsx</div><small>PCD009 · CP1 / CP2 / CP3</small></div><button data-action="load-book">${state.book?'继续编辑':'打开示例'}</button></div><p class="hint">不打开程序，也可以直接使用 SCAN 转换。</p></section><section class="panel"><div class="panel-head row between"><h2>转换任务</h2>${badge(state.job?'进行中':state.result?(stale()?'需更新':'已完成'):'暂无任务',stale()?'warn':'gray')}</div><p>${state.job?'切换工具后，转换继续运行。':state.result?`${state.result.files.length} 个 WGL · ${state.result.platforms.map(p=>p==='chroma'?'Chroma':'S100').join(' + ')}`:'转换记录会出现在这里。'}</p><p class="hint">${state.association?'已关联：'+esc(state.association):'结果由您主动关联到 SCAN / MBIST 测试项。'}</p>${state.result||state.job?'<button style="margin-top:13px" data-page="scan">查看任务</button>':''}</section></div>`}
function program(){if(!state.book)return heading('PROGRAM GENERATOR','程序生成','现有工作簿编辑功能保留在这个模块中。')+`<section class="panel empty-workbook"><div class="tool-icon" style="margin:0 auto 20px">▤</div><h2>打开一个程序，继续配置</h2><p>原型中使用示例工作簿，不读取或修改您的真实 Excel。</p><button class="primary" data-action="load-book">打开示例工作簿</button><button data-page="scan">先去独立转换</button></section>`;
return heading('PROGRAM GENERATOR','程序生成','program_PCD009_V1.0.xlsx · 编辑区为结构示意，正式接入保留现有功能。',`<button data-action="edit-pin">演示修改 PIN DEC</button><button class="primary" data-action="generate">演示生成检查</button>`)+`<section class="panel"><div class="row between program-toolbar"><div class="row"><button class="active">编辑工作簿</button><span class="muted">生成与导出　检查记录　存储映射</span></div>${badge(state.revision?'草稿已修改':'已载入示例')}</div><div class="editor-layout"><aside class="sheet-list"><small>工作表</small><div>VERSION</div><div class="selected">FLOW</div><div>　CP1</div><div>　CP2</div><div>　CP3</div><div>ADDR_MAP</div><div>PIN DEC</div><div>pattern</div></aside><div class="table-wrap"><table><thead><tr><th>行</th><th>item</th><th>type</th><th>mode</th><th>Recipe</th></tr></thead><tbody>${[['3','VREF0P8_TC','trim','fbist','ENTER → TRIM → JUDGE'],['4','Vref0p8_ABS','verify','fbist','ENTER → JUDGE'],['5','Hsi_8M','trim','fbist','ENTER → TRIM → JUDGE'],['21','Scan_Chain_Test','verify','scan','SCAN Pattern'],['22','Scan_AtSpeed_Test','verify','scan','SCAN Pattern'],['23','Mbist_Test','verify','mbist','MBIST Pattern']].map((r,i)=>`<tr class="${i===3?'selected':''}">${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><aside class="link-preview"><h3>关联预览</h3><div class="mini-card"><strong>${esc(state.association||'Scan_Chain_Test')}</strong><p class="hint">CP1 · SCAN</p></div><h3>Pattern 资源</h3><div class="mini-card">${state.association?badge(stale()?'需要重新转换':'已关联',stale()?'warn':'')+'<p class="hint">'+state.result.files.map(esc).join('<br>')+'</p>':'尚未关联转换结果'}</div><button data-page="scan">打开 SCAN 转换</button></aside></div>${state.association&&stale()?'<div class="alert">关联保留，但相关输入已变化。更新转换结果后才能继续生成程序。</div>':''}</section>`}
function files(){return `<section class="panel files-panel"><div class="panel-head row between"><h2>输入文件</h2>${badge(state.files.length+' 个 WGL','gray')}</div><div id="dropzone" class="dropzone"><h3>添加 WGL 文件</h3><p>可以多选或拖入文件；原型仅显示名称。</p><div class="row" style="justify-content:center"><button data-action="pick-files">选择文件</button><button data-action="sample-files">载入示例文件</button></div></div>${state.files.map((name,i)=>`<div class="file-row"><div><div class="file-title">${esc(name)}</div><small>输入版本 ${state.inputRevision} · ${name.startsWith('dc_')?'Chain scan':name.startsWith('ac_')?'At-speed scan':'WGL 文件'}</small></div><button class="ghost" data-remove="${i}" aria-label="移除 ${esc(name)}">×</button></div>`).join('')}<p class="hint">输出包含 Pattern、SCAN 代码片段与配套时序，不生成完整工程。</p></section>`}
function config(){return `<section class="panel config-panel"><h2>转换配置</h2><label class="field"><span>目标平台</span></label><div class="platforms">${[['chroma','Chroma'],['s100','S100']].map(([v,n])=>`<label><input type="checkbox" data-platform="${v}" ${state.platforms.includes(v)?'checked':''}> ${n}</label>`).join('')}</div><p class="hint">同时选择时，按平台分目录输出。</p><hr class="divider"><label class="check-line"><input type="checkbox" id="adapt" ${state.adapt?'checked':''}> <strong>适配程序配置</strong></label>${state.adapt?`<div class="config-source"><label class="field"><span>配置来源</span><select id="source"><option value="current" ${state.source==='current'?'selected':''}>当前工作台配置（含未保存修改）</option><option value="other" ${state.source==='other'?'selected':''}>选择其他程序 Excel</option></select></label>${state.source==='current'?`<p class="hint">${state.book?'PCD009 · 草稿版本 '+state.revision:'当前未打开程序 Excel'}</p>${!state.book?'<button data-action="load-config">载入示例程序配置</button>':''}`:`<p class="hint">${state.other?'other_program.xlsx · 示例配置':'单独读取，不替换当前工作簿'}</p><button data-action="other-book">选择示例 Excel</button>`}</div>`:''}<div class="mode-summary" style="margin-top:16px"><strong>${state.adapt?'按程序配置适配':'Full Pin · 独立转换'}</strong><p class="hint">${state.adapt?'统一管脚名称、筛选与排序向量列，适配程序与时序引用。':'保留 WGL 完整管脚，无需程序 Excel。'}<br>波形与周期均来自 WGL。</p></div><label class="field"><span>输出目录名称 · 演示</span><input id="output" value="${esc(state.output)}" style="width:100%"></label><p class="hint">每次任务固定启动时的输入和配置。</p>${state.variant!=='C'?runButton():''}</section>`}
function runButton(){return `<button class="primary" data-action="convert" style="width:100%;margin-top:20px" ${!valid()||state.job?'disabled':''}>${state.job?'正在演示转换…':stale()?'重新转换 · 演示':'开始转换 · 演示'}</button>${!valid()?'<p class="hint">请添加 WGL、选择平台，并提供所需配置。</p>':''}`}
function results(){const r=state.result;return `<section class="panel results-panel"><div class="panel-head row between"><h2>转换结果</h2>${state.job?badge('进行中'):r?badge(stale()?'需要重新转换':'转换完成',stale()?'warn':''):badge('等待转换','gray')}</div>${state.job?`<p>正在生成 Pattern、代码片段和时序…</p><div class="progress-track"><i></i></div><p class="hint">已固定输入版本 ${state.job.inputRevision} / ${state.job.adapt?'配置版本 '+state.job.revision:'Full Pin'}，可切换到其他工具。</p>`:''}${!r&&!state.job?'<div class="result-empty">转换完成后，在这里查看文件、代码和关联状态。</div>':''}${r?`${stale()?'<div class="alert">WGL 或当前程序配置已变化。关联仍保留，生成程序前需要重新转换。</div>':''}<div class="row between" style="margin-bottom:17px"><div>${badge(r.adapt?'程序适配':'Full Pin','gray')} <small>${r.files.length} 个文件 · 输入版本 ${r.inputRevision} · ${r.adapt?'配置版本 '+r.revision:'未使用 Excel'}</small></div><button data-action="open-link" ${!state.book||stale()||state.job?'disabled':''}>${state.association?'更改关联':'关联到测试项'}</button></div>${!state.book?'<p class="hint">打开程序工作簿后可关联；独立转换不需要关联。</p>':''}${state.association?'<p style="margin-bottom:13px">'+badge('已关联')+' <strong>'+esc(state.association)+'</strong></p>':''}<div class="result-grid"><div>${r.platforms.map(p=>`<div class="output-path">${esc(r.output)}/${p}/</div>${r.files.map(f=>`<div class="file-row"><span class="file-title">${esc(f.replace(/\.wgl$/i,''))}.${p==='chroma'?'pat':'sd'}</span>${badge(stale()?'待更新':'示例','gray')}</div>`).join('')}<small>scan_code.txt · scan_timing.txt</small>`).join('<hr class="divider">')}</div><div><div class="row" style="margin-bottom:9px">${[['pattern','Pattern'],['code','程序片段'],['timing','时序']].map(([k,n])=>`<button data-preview="${k}" class="${state.preview===k?'active':''}">${n}</button>`).join('')}</div><pre class="code">${esc(preview(r))}</pre><small>仅用于查看操作流程，示例内容不可用于编译。</small></div></div>`:''}</section>`}
function preview(r){const stem=r.files[0].replace(/\.wgl$/i,'');if(state.preview==='pattern')return `// Pattern 示例预览\n// ${r.adapt?'管脚及顺序来自程序 PIN DEC':'Full Pin：保留 WGL 全部管脚'}\n// ${stem}\n\nHEADER  ${r.adapt?'PA0 PA1 PB0 NRST':'PAD_PA_0 PAD_PA_1 PAD_PB_0 PAD_RESET'}\n\nVECTOR  01HL\nVECTOR  10LH\n…`;
if(state.preview==='code')return `// SCAN 程序片段 · 结构示意\n// 平台：${r.platforms.join(' / ')}\n// 不包含完整项目骨架\n\n配置管脚与测试条件\n应用 WGL 派生时序\n依次执行并判定：\n${r.files.map(f=>'  '+f.replace(/\.wgl$/i,'')).join('\n')}\n恢复测试条件`;
return `// 时序定义 · 结构示意\n// 周期与波形来自 WGL\n\n${r.adapt?'项目时序编号 → WGL timeplate':'独立时序定义 → WGL timeplate'}\nperiod : 取自输入 WGL\ndrive  : 取自输入 WGL\ncompare: 取自输入 WGL`}
function scan(){let body=heading('SCAN CONVERTER','SCAN 转换','WGL → Pattern + 程序片段 + 时序',badge(state.adapt?'程序适配':'Full Pin','gray'));
if(state.variant==='C'){body+=`<div class="flow-steps">${['添加文件','设置转换','查看与关联'].map((n,i)=>`<button data-step="${i}" class="${state.step===i?'active':''}"><span class="step-num">0${i+1}</span>${n}</button>`).join('')}</div><div class="scan-grid">${state.step===0?files():state.step===1?config():results()}<div class="step-controls"><button data-step="${Math.max(0,state.step-1)}" ${state.step===0?'disabled':''}>← 上一步</button>${state.step===0?'<button class="primary" data-step="1">设置转换 →</button>':state.step===1?runButton():`<button data-step="1">返回配置${stale()?'并重新转换':''}</button>`}</div></div>`}else body+=`<div class="scan-grid">${files()}${config()}${results()}</div>`;return body}
function demo(){return `<details class="demo-panel"><summary>原型演示操作与状态</summary><div class="row"><button data-action="edit-pin" ${!state.book?'disabled':''}>模拟 PIN DEC 修改</button><button data-action="edit-wgl" ${!state.files.length?'disabled':''}>模拟 WGL 更新</button><button data-action="reset">重置演示</button></div><div class="state-line">布局 ${state.variant} · 页面 ${state.page} · 工作簿 ${state.book?'PCD009':'无'} · 草稿 ${state.revision} · WGL ${state.files.length} 个 / 版本 ${state.inputRevision} · 模式 ${state.adapt?'适配 / '+state.source:'Full Pin'} · 平台 ${state.platforms.join(', ')||'未选'} · 任务 ${state.job?'运行中':state.result?'完成':'未开始'} · 结果 ${stale()?'过期':'—'} · 关联 ${esc(state.association||'无')}</div></details>`}
function wireInputs(){const a=$('#adapt'),s=$('#source'),o=$('#output');if(a)a.onchange=()=>{state.adapt=a.checked;render()};if(s)s.onchange=()=>{state.source=s.value;render()};if(o)o.oninput=()=>state.output=o.value;document.querySelectorAll('[data-platform]').forEach(el=>el.onchange=()=>{state.platforms=el.checked?[...state.platforms,el.dataset.platform]:state.platforms.filter(p=>p!==el.dataset.platform);render()});const d=$('#dropzone');if(d){d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};d.ondragleave=()=>d.classList.remove('drag');d.ondrop=e=>{e.preventDefault();addFiles([...e.dataTransfer.files].map(f=>f.name))}}}
function addFiles(names){const accepted=names.filter(n=>/\.wgl$/i.test(n));state.files=[...new Set([...state.files,...accepted])];if(accepted.length)state.inputRevision++;render();if(!accepted.length)notify('请选择 WGL 文件。')}
function variant(v){const keys=Object.keys(variants),i=keys.indexOf(state.variant);state.variant=v==='prev'?keys[(i+2)%3]:v==='next'?keys[(i+1)%3]:v;const url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.variant){variant(b.dataset.variant);return}if(b.dataset.page){state.page=b.dataset.page;render();return}if(b.dataset.step!==undefined){state.step=Number(b.dataset.step);render();return}if(b.dataset.preview){state.preview=b.dataset.preview;render();return}if(b.dataset.remove!==undefined){state.files.splice(Number(b.dataset.remove),1);state.inputRevision++;render();return}
switch(b.dataset.action){case'load-book':state.book=true;state.page='program';notify('已载入示例工作簿，未打开真实 Excel。');break;case'load-config':state.book=true;break;case'other-book':state.other=true;notify('已选择另一份示例 Excel，当前工作簿保持不变。');break;case'pick-files':$('#file-picker').click();return;case'sample-files':addFiles(['dc_scan_chain_test_1.wgl','ac_scan_scan_test_1.wgl']);return;case'edit-pin':if(!state.book){notify('请先打开示例工作簿。');return}state.revision++;notify(stale()?'相关配置已变化：转换结果需要更新。':'已模拟修改 PIN DEC，草稿尚未保存。');break;case'edit-wgl':state.inputRevision++;notify('已模拟 WGL 更新。已有转换结果需要更新。');break;case'generate':notify(state.association&&stale()?'已阻止生成：关联 Pattern 需要重新转换。':'演示检查通过；原型不会实际生成程序。');break;case'convert':if(!valid()||state.job)return;const snapshot={files:[...state.files],platforms:[...state.platforms],inputRevision:state.inputRevision,revision:state.adapt&&state.source==='current'?state.revision:0,adapt:state.adapt,source:state.source,output:state.output||'SCAN_Output'};state.job=snapshot;state.step=2;setTimeout(()=>{state.result=snapshot;state.job=null;render();notify(stale()?'演示转换完成，但输入已变化，需要重新转换。':'演示转换完成，可查看结果或关联测试项。')},1800);break;case'open-link':$('#link-dialog').showModal();return;case'close-link':$('#link-dialog').close();return;case'confirm-link':state.association=$('#link-target').value;$('#link-dialog').close();notify('已建立演示关联，未修改真实 FLOW。');break;case'reset':if(state.job){notify('请等待演示任务完成后重置。');return}Object.assign(state,{book:false,revision:0,files:[],inputRevision:0,adapt:false,source:'current',other:false,platforms:['chroma','s100'],step:0,job:null,result:null,association:null,output:'SCAN_Output',preview:'pattern',page:'home'});break;default:return}render()});
$('#file-picker').onchange=e=>{addFiles([...e.target.files].map(f=>f.name));e.target.value=''};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable=true]')||$('#link-dialog').open)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();variant(e.key==='ArrowLeft'?'prev':'next')}});
render();
</script></body></html>
