<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 助手 · MCU 工作台</title>
<style>
:root{font:14px "Segoe UI","Microsoft YaHei",sans-serif;color:#223348;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;border-radius:7px;padding:8px 12px;background:white;color:#223348}button:hover{background:#eef4ff}button:disabled{opacity:.5;cursor:default}.primary{background:#245fbe;color:white;border-color:#245fbe}header{display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid #dce3ed;padding:16px 22px}h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 12px}.muted{color:#697a8e;font-size:12px;line-height:1.6}.layout{display:grid;grid-template-columns:195px 1fr;min-height:calc(100vh - 72px)}aside{padding:16px 12px;border-right:1px solid #dce3ed}#history{display:grid;gap:8px;margin-top:14px}#history button{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}main{padding:20px;min-width:0;max-width:1000px;width:100%;margin:auto}.card{background:white;border:1px solid #dce3ed;border-radius:10px;padding:16px;margin-bottom:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}label{display:grid;gap:5px}input,select,textarea{border:1px solid #bdcbdc;border-radius:6px;padding:8px;max-width:100%;background:white}textarea{width:100%;min-height:100px;resize:vertical}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 "Microsoft YaHei",sans-serif;margin:12px 0}#error{color:#a72c36;white-space:pre-wrap}#stage{color:#245fbe}details{margin:10px 0}summary{cursor:pointer;color:#426286}.candidate{border-left:3px solid #245fbe;padding:12px 14px;background:#f4f7fc;margin-top:12px}.steps{max-height:280px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #dce3ed;text-align:left;padding:6px}dialog{border:1px solid #ccd7e5;border-radius:12px;max-width:550px;width:90%;padding:24px}dialog::backdrop{background:#14243a60}dialog label{margin:12px 0}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}#context-label{word-break:break-all}@media(max-width:740px){.layout{grid-template-columns:140px 1fr}main{padding:12px}}
</style></head><body>
<header><div><h1>✧ AI 助手</h1><div class="muted">工程问答 · 配置候选 · 资料引导</div></div><div class="row"><button id="undo">撤销送入编辑器</button><button id="settings-open">模型设置</button></div></header>
<div class="layout"><aside><button id="new-task">新问题</button><button id="clear-history">清空历史</button><div id="history" aria-label="本机任务历史"></div></aside>
<main><div class="card"><h2>本次对象</h2><div id="context-label" class="muted">提问时读取主窗口当前草稿，包括未保存的 SWD 步骤。</div>
<details><summary>生成配置的条件</summary><div class="row"><label>产品<select id="product"><option value="">请选择</option><option>PT104</option><option>PCD009</option></select></label><label>平台<select id="platform"><option value="">请选择</option><option value="chroma">Chroma</option><option value="s100">S100</option></select></label></div>
<label class="check"><input id="reset" type="checkbox">本次配置从已复位的寄存器状态开始</label><p class="muted">这是流程前提，不会操作硬件。已有运行状态不能当作复位状态。</p></details></div>
<div id="result" class="card" hidden><details><summary>此前问答</summary><div id="conversation"></div></details><div id="stage" role="status" aria-live="polite"></div><pre id="question"></pre><pre id="answer"></pre><div id="events"></div><div id="candidates"></div></div>
<div class="card"><label for="prompt"><h2>需要协助什么？</h2></label><textarea id="prompt" maxlength="16000" placeholder="例如：解释当前 SWD 步骤，或列出新产品需要准备的资料。"></textarea><div class="row" style="margin-top:12px"><button id="send" class="primary">发送</button><button id="cancel" disabled>取消任务</button><span id="model-label" class="muted">尚未配置模型</span></div><p class="muted">发送后，问题与本次草稿快照会传给所选模型服务。生成结果先作为独立候选保留。</p><div id="error" role="alert"></div></div>
</main></div>
<dialog id="settings"><h2>模型连接</h2><p class="muted">密钥仅由本机后端使用，不进入聊天、草稿或模型提示。</p><label>服务商<select id="provider"><option value="deepseek">DeepSeek</option><option value="kimi">Kimi 开放平台（按量付费）</option><option value="kimi-code">Kimi Code（月订阅）</option></select></label><label id="kimi-region-label" hidden>Kimi 接口地区<select id="kimi-region"><option value="china">国内（api.moonshot.cn）</option><option value="international">国际（api.moonshot.ai）</option></select></label><label>模型<select id="model"></select></label><p id="model-note" class="muted"></p><label>API 密钥<input id="key" type="password" autocomplete="off" placeholder="留空保留当前服务商密钥"></label><label class="check"><input id="remember" type="checkbox">使用 Windows 当前用户加密保存</label><label>推理档位<select id="effort"><option value="max">max</option><option value="high">high</option><option value="low">low</option></select></label><label>单次输出上限<input id="tokens" type="number" min="1024" max="131072" value="8192"></label><div class="row"><button id="settings-save" class="primary">保存设置</button><button id="connection-test">测试连接与工具</button><button id="key-clear">清除密钥</button><button id="settings-close">关闭</button></div><p id="settings-status" class="muted"></p></dialog>
<script src="/assistant.js"></script></body></html>
